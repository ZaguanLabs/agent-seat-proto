[workspace]
members = [
    "crates/agent-seat-activity-broker",
    "crates/agent-seat-mcp",
    "crates/agent-seat-proto",
    "crates/agent-seat-settings",
    "crates/agent-seat-x11",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ZaguanLabs/agent-seat-proto"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
agent-seat-activity-broker = { path = "crates/agent-seat-activity-broker", version = "0.1.14", default-features = false }
dbus = "0.9.10"
evdev = "0.13.2"
rustix = { version = "1", features = ["fs", "net", "process"] }
sd-listen-fds = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
toml_edit = "0.22"
gtk = { package = "gtk4", version = "=0.10.3" }
x11rb = "0.14"
