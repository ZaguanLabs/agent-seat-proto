[workspace]
members = [
    "crates/agent-seat-mcp",
    "crates/agent-seat-proto",
    "crates/agent-seat-x11",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ZaguanLabs/agent-seat-proto"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
