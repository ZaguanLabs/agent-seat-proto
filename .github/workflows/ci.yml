name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: source gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Install desktop test dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends desktop-file-utils libdbus-1-dev libgtk-4-dev openbox xterm xvfb
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Build documentation
        run: cargo doc --workspace --no-deps
      - name: Validate desktop integration
        run: desktop-file-validate contrib/org.zaguanlabs.AgentSeat.Settings.desktop
